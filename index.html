<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>收纳小当家 · 整理收纳小游戏</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* ===== 设计令牌 ===== */
:root{
  --ink:#6B4F3A;
  --ink-soft:#8A6A4F;
  --paper:#FFFDF6;
  --paper-2:#F7EFDD;
  --cream:#FBF3E0;
  --wood:#B98A5F;
  --wood-dark:#8A5F3D;
  --accent:#E58B7E;
  --sage:#7FA16B;
  --sky:#7FA1C3;
  --amber:#E8B45C;
  --shadow-ink:rgba(107,79,58,.16);
  --font-display:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',sans-serif;
  --font-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:
    radial-gradient(circle at 18% 12%, rgba(232,180,92,.14) 0 90px, transparent 91px),
    radial-gradient(circle at 82% 88%, rgba(127,161,107,.14) 0 110px, transparent 111px),
    linear-gradient(180deg,#FBF3E0 0%, #F7EFDD 100%);
  min-height:100%;
  overflow-x:hidden;
}
#app{max-width:1120px;margin:0 auto;padding:16px 16px 40px}

button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ===== 通用按钮 ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-display);font-size:19px;letter-spacing:1px;
  background:var(--accent);color:var(--paper);
  border:2.5px solid var(--ink);border-radius:999px;
  padding:12px 30px;box-shadow:0 5px 0 var(--ink);
  transition:transform .12s, box-shadow .12s, background .2s;
}
.btn:hover{background:#EC9B8E}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.secondary{background:var(--paper);color:var(--ink)}
.btn.secondary:hover{background:#F7EFDD}
.btn.small{font-size:16px;padding:9px 20px}
.btn.wood{background:var(--wood);color:#FFFDF6}

/* ===== 开始页 ===== */
#screen-start{min-height:calc(100vh - 56px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding:30px 14px}
.logo-badge{
  width:132px;height:132px;border-radius:50%;
  background:linear-gradient(160deg,#F7E0B0,#E8B45C);
  border:4px solid var(--ink);box-shadow:0 8px 0 var(--shadow-ink), 0 18px 34px rgba(120,90,60,.22);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:64px;color:#FFFDF6;
  text-shadow:0 3px 0 rgba(107,79,58,.35);
  transform:rotate(-6deg);
}
.game-title{font-family:var(--font-display);font-size:52px;letter-spacing:4px;text-shadow:0 3px 0 rgba(120,90,60,.12)}
.game-sub{color:var(--ink-soft);font-size:16px;max-width:520px;line-height:1.7}
.rules{display:flex;flex-direction:column;gap:10px;background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;padding:20px 24px;box-shadow:0 6px 0 var(--shadow-ink);text-align:left;max-width:520px}
.rules li{list-style:none;display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink)}
.rules .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sage);color:#FFF;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.best-line{font-family:var(--font-display);font-size:20px;color:var(--wood-dark)}
.best-line svg{vertical-align:-3px}

/* ===== 游戏页头部 ===== */
#screen-game.hidden,#ov-intro.hidden,#ov-pause.hidden,#ov-clear.hidden,#ov-timeout.hidden,#ov-final.hidden{display:none}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.lv-chip{font-family:var(--font-display);font-size:18px;background:var(--wood);color:#FFFDF6;border:2.5px solid var(--ink);border-radius:999px;padding:7px 16px;box-shadow:0 4px 0 var(--shadow-ink)}
.pill{
  display:inline-flex;align-items:center;gap:7px;background:var(--paper);
  border:2.5px solid var(--ink);border-radius:999px;padding:7px 15px;
  font-weight:700;font-size:16px;box-shadow:0 4px 0 var(--shadow-ink);
}
.pill svg{flex:none}
.pill.timer.low{background:#F4C7BD;animation:blink 1s steps(2) infinite}
.pill.score{font-family:var(--font-display);letter-spacing:1px}
.pill.score b{color:var(--accent)}
.spacer{flex:1}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--shadow-ink);transition:transform .12s}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow-ink)}
.hintbar{text-align:center;color:var(--ink-soft);font-size:14px;margin-bottom:12px;min-height:22px}
.hintbar b{color:var(--ink);font-family:var(--font-display);font-weight:400}

/* ===== 游戏面板 ===== */
#board{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}

/* 地板区 */
.floor-card{
  background:var(--paper);border:3px solid var(--ink);border-radius:24px;
  box-shadow:0 8px 0 var(--shadow-ink), 0 20px 40px rgba(120,90,60,.16);
  overflow:hidden;position:relative;
}
.floor{
  position:relative;min-height:420px;padding:24px;
  background-size:cover;background-position:center;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
  gap:14px;align-content:start;
}
.floor .shadow-layer{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.10), rgba(120,90,60,.14));pointer-events:none}
.floor-item{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:var(--paper);border:2.5px solid var(--ink);border-radius:15px;
  padding:10px 6px 7px;min-height:96px;
  box-shadow:0 4px 0 rgba(107,79,58,.18), 0 10px 16px rgba(120,90,60,.14);
  cursor:grab;touch-action:none;user-select:none;
  transition:transform .15s, box-shadow .15s, opacity .15s;
  z-index:2;
}
.floor-item:hover{transform:translateY(-4px) rotate(var(--tilt,0deg));box-shadow:0 8px 0 rgba(107,79,58,.18),0 14px 20px rgba(120,90,60,.18)}
.floor-item:active{cursor:grabbing}
.floor-item .icon{width:46px;height:46px;pointer-events:none}
.floor-item .lbl{font-size:12px;font-weight:700;color:var(--ink);pointer-events:none}
.floor-item.dragging{opacity:.3}
.floor-item.held{outline:3.5px dashed var(--accent);outline-offset:2px;transform:scale(1.05);box-shadow:0 6px 0 rgba(107,79,58,.2),0 16px 26px rgba(120,90,60,.2)}
.floor-item.shake{animation:shake .45s}
.floor-item.removing{animation:popaway .3s forwards}

/* 收纳区 */
.storage{display:flex;flex-direction:column;gap:14px}
.container{
  position:relative;background:linear-gradient(180deg,#C99B6E,#B4855B);
  border:2.5px solid var(--ink);border-radius:18px;padding:16px 12px 12px;
  box-shadow:0 6px 0 var(--shadow-ink), 0 14px 24px rgba(120,90,60,.18);
  transition:outline .2s, transform .2s;
}
.container.match{outline:4px solid rgba(127,161,107,.65);outline-offset:2px;transform:translateY(-2px)}
.container.wrong{animation:shake .45s}
.washi{
  position:absolute;top:-11px;left:16px;width:92px;height:23px;
  background:rgba(255,220,158,.85);border:1.5px dashed rgba(107,79,58,.45);
  border-radius:3px;transform:rotate(-5deg);pointer-events:none;
}
.container-head{display:flex;align-items:center;gap:8px;color:#5A422F;padding:0 2px}
.container-head .glyph{width:30px;height:30px;flex:none}
.container-head .name{font-family:var(--font-display);font-size:19px;letter-spacing:1px}
.container .slots{display:flex;gap:9px;margin-top:11px;flex-wrap:wrap}
.slot{
  position:relative;width:50px;height:50px;border-radius:13px;
  background:#FBF3E0;border:2.5px dashed #A98358;
  display:flex;align-items:center;justify-content:center;
}
.slot .mini{width:36px;height:36px;animation:slotpop .35s cubic-bezier(.34,1.56,.64,1)}
.slot.filled{background:#F7EFDD;border-style:solid;border-color:var(--ink)}
.slot .burst{position:absolute;inset:0;pointer-events:none}
.slot .burst i{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:var(--amber);animation:burst .55s ease-out forwards}
.burst i:nth-child(1){--dx:-20px;--dy:-16px}
.burst i:nth-child(2){--dx:18px;--dy:-18px}
.burst i:nth-child(3){--dx:22px;--dy:6px}
.burst i:nth-child(4){--dx:-22px;--dy:8px}
.burst i:nth-child(5){--dx:-4px;--dy:-24px}
.burst i:nth-child(6){--dx:8px;--dy:20px}
.burst i:nth-child(2n){background:var(--sage)}
.burst i:nth-child(3n){background:var(--accent)}

/* 拖拽幽灵 */
.ghost{
  position:fixed;z-index:999;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;
  padding:8px 6px 6px;box-shadow:0 14px 26px rgba(120,90,60,.3);
  will-change:transform,opacity;
}
.ghost .icon{width:44px;height:44px}
.ghost .lbl{font-size:12px;font-weight:700;color:var(--ink)}

/* 飘分提示 */
.toast{
  position:fixed;left:50%;top:34%;z-index:998;
  transform:translateX(-50%);
  font-family:var(--font-display);font-size:26px;color:var(--wood-dark);
  text-shadow:0 2px 0 rgba(255,253,246,.9);
  pointer-events:none;animation:toastfloat 1.15s ease-out forwards;
  white-space:nowrap;
}

/* ===== 浮层面板 ===== */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(107,79,58,.42);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:18px}
.panel{
  background:var(--paper);border:3px solid var(--ink);border-radius:26px;
  padding:30px 34px;max-width:430px;width:100%;text-align:center;
  box-shadow:0 10px 0 rgba(107,79,58,.2), 0 30px 60px rgba(60,40,25,.35);
  animation:panelin .3s cubic-bezier(.34,1.4,.64,1);
}
.panel .p-title{font-family:var(--font-display);font-size:32px;letter-spacing:2px;margin-bottom:6px}
.panel .p-sub{color:var(--ink-soft);font-size:15px;line-height:1.7;margin-bottom:18px}
.panel .big-score{font-family:var(--font-display);font-size:44px;color:var(--accent);margin:6px 0 2px}
.panel .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.panel .actions .btn{flex:1;min-width:150px}

/* 橡皮章签名元素 */
.stamp{
  width:158px;height:158px;border-radius:50%;
  border:5px double var(--ink);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-family:var(--font-display);letter-spacing:2px;
  box-shadow:inset 0 0 0 6px rgba(107,79,58,.06);
  background:radial-gradient(circle, rgba(107,79,58,.05) 0 55%, transparent 56%);
  transform:scale(2.4) rotate(-16deg);opacity:0;
  animation:stampin .55s cubic-bezier(.2,1.4,.4,1) .15s forwards;
  margin:8px auto 16px;
}
.stamp .st-main{font-size:24px}
.stamp .st-star{display:flex;gap:2px;margin-top:2px}

/* 星级 */
.stars{display:flex;gap:6px;justify-content:center;margin:10px 0 4px}
.stars .star{width:34px;height:34px;transform:rotate(0);animation:starin .45s cubic-bezier(.34,1.56,.64,1) backwards}
.stars .star.dim{opacity:.28}

/* ===== 动画 ===== */
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes slotpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes popaway{0%{transform:scale(1);opacity:1}100%{transform:scale(.2) rotate(12deg);opacity:0}}
@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
@keyframes toastfloat{0%{transform:translate(-50%,16px);opacity:0}18%{transform:translate(-50%,0);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-46px);opacity:0}}
@keyframes panelin{0%{transform:scale(.86) translateY(14px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes stampin{0%{transform:scale(2.4) rotate(-16deg);opacity:0}60%{transform:scale(.95) rotate(-7deg);opacity:1}100%{transform:scale(1) rotate(-10deg);opacity:1}}
@keyframes starin{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
@keyframes blink{50%{opacity:.55}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,139,126,.5)}50%{box-shadow:0 0 0 10px rgba(229,139,126,0)}}

/* ===== 响应式 ===== */
@media (max-width:860px){
  #board{grid-template-columns:1fr}
  .floor{min-height:320px;padding:16px;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
  .floor-item{min-height:86px;padding:8px 4px 6px}
  .floor-item .icon{width:40px;height:40px}
  .game-title{font-size:38px}
  .storage{flex-direction:row;flex-wrap:wrap}
  .container{flex:1 1 46%}
}
@media (max-width:420px){
  .game-title{font-size:32px}
  .topbar .pill{font-size:14px;padding:6px 11px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="app">

  <!-- ===== 开始页 ===== -->
  <section id="screen-start">
    <div class="logo-badge">收</div>
    <h1 class="game-title">收纳小当家</h1>
    <p class="game-sub">房间乱成一团啦，把散落的东西拖回它该待的地方：书本回书架、玩具进收纳筐、碗碟进橱柜……全部归位即可过关！</p>
    <ul class="rules">
      <li><span class="num">1</span>用手指或鼠标<b>拖动物品</b>，放到下方对应的收纳位</li>
      <li><span class="num">2</span>也可以<b>点一下物品再点收纳位</b>，一样能放好</li>
      <li><span class="num">3</span>连放正确会触发<b>连击加分</b>，在时间内收完得更多星</li>
    </ul>
    <p class="best-line" id="start-best">最高分 0</p>
    <button class="btn" id="btn-start">开始收纳</button>
  </section>

  <!-- ===== 游戏页 ===== -->
  <section id="screen-game" class="hidden">
    <header class="topbar">
      <span class="lv-chip" id="lv-name">第1关 · 客厅</span>
      <span class="pill score" id="score-pill">得分 <b id="score-num">0</b></span>
      <span class="pill timer" id="timer-pill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <span id="timer-num">60</span>
      </span>
      <span class="spacer"></span>
      <button class="icon-btn" id="btn-pause" aria-label="暂停">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/></svg>
      </button>
    </header>
    <p class="hintbar" id="hintbar">拖动物品，放进对应的收纳位</p>

    <div id="board">
      <div class="floor-card">
        <div class="floor" id="floor"></div>
        <div class="shadow-layer"></div>
      </div>
      <div class="storage" id="storage"></div>
    </div>
  </section>

  <!-- ===== 关卡介绍浮层 ===== -->
  <div class="overlay hidden" id="ov-intro">
    <div class="panel">
      <div class="p-title" id="intro-title">第1关 · 客厅大扫除</div>
      <p class="p-sub" id="intro-sub">把散落的东西放回它们的位置！</p>
      <p class="p-sub" id="intro-meta" style="margin-bottom:4px"></p>
      <div class="actions"><button class="btn" id="btn-go">开始收纳</button></div>
    </div>
  </div>

  <!-- ===== 暂停浮层 ===== -->
  <div class="overlay hidden" id="ov-pause">
    <div class="panel">
      <div class="p-title">休息一下</div>
      <p class="p-sub">收纳进度已帮你暂停，回来继续！</p>
      <div class="actions"><button class="btn" id="btn-resume">继续收纳</button></div>
    </div>
  </div>

  <!-- ===== 过关浮层 ===== -->
  <div class="overlay hidden" id="ov-clear">
    <div class="panel">
      <div class="stamp">
        <span class="st-main">收纳完成</span>
        <span class="st-star">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>
        </span>
      </div>
      <div class="stars" id="clear-stars"></div>
      <div class="big-score" id="clear-score">+0</div>
      <p class="p-sub" id="clear-sub"></p>
      <div class="actions">
        <button class="btn secondary small" id="btn-retry-level">重玩本关</button>
        <button class="btn" id="btn-next">下一关</button>
      </div>
    </div>
  </div>

  <!-- ===== 时间到浮层 ===== -->
  <div class="overlay hidden" id="ov-timeout">
    <div class="panel">
      <div class="p-title">时间到啦！</div>
      <p class="p-sub" id="timeout-sub"></p>
      <div class="actions">
        <button class="btn secondary" id="btn-retry-timeout">再试一次</button>
        <button class="btn wood" id="btn-restart-timeout">重新开始</button>
      </div>
    </div>
  </div>

  <!-- ===== 最终结算浮层 ===== -->
  <div class="overlay hidden" id="ov-final">
    <div class="panel">
      <div class="p-title">全部收纳完成！</div>
      <div class="stars" id="final-stars"></div>
      <div class="big-score" id="final-score">0</div>
      <p class="p-sub">刷新最高分吧，你就是收纳小当家！</p>
      <p class="p-sub" id="final-best"></p>
      <div class="actions">
        <button class="btn" id="btn-again">再来一局</button>
        <button class="btn secondary" id="btn-home">回到首页</button>
      </div>
    </div>
  </div>

</div>

<script>
"use strict";
/* ===== 物品图标库（统一贴纸风，手写内联 SVG） ===== */
const ICONS = {
  book:'<svg viewBox="0 0 48 48"><path d="M7 12c7-2.5 12-.5 16 3.5v19c-4-4-9-6-16-3.5z" fill="#E8B45C" stroke="#6B4F3A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M41 12c-7-2.5-12-.5-16 3.5v19c4-4 9-6 16-3.5z" fill="#EFC87E" stroke="#6B4F3A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M23 15.5v19" stroke="#6B4F3A" stroke-width="2.6" stroke-linecap="round"/></svg>',

  held:null,               // 点选模式下被拿起的物品 {el, rec}
  drag:null,               // 拖拽中 {el, rec, startX, startY, moved, home}
  raf:0, lastTs:0,
  totalStars:0,
  best:0
};
try{ state.best = Number(localStorage.getItem('tidygame_best')||0); }catch(e){ state.best=0; }

/* ===== 工具 ===== */
function shuffle(a){
  a=a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function saveBest(){
  if(state.score>state.best){ state.best=state.score; }
  try{ localStorage.setItem('tidygame_best', String(state.best)); }catch(e){}
}
function show(id){ id.classList.remove('hidden'); }
function hide(id){ id.classList.add('hidden'); }
function setHint(txt){ hintbar.innerHTML = txt; }

/* ===== 分数与计时 ===== */
function renderScore(){ scoreNum.textContent = state.score; }
function renderTimer(){
  const s=Math.max(0,Math.ceil(state.timeLeft));
  timerNum.textContent = s;
  timerPill.classList.toggle('low', s<=10);
}
function toast(msg){
  const t=document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1200);
}

/* ===== 关卡渲染 ===== */
function buildLevel(){
  const L = LEVELS[state.levelIdx];
  lvName.textContent = '第'+(state.levelIdx+1)+'关 · '+L.name;
  // 收纳位
  storageEl.innerHTML='';
  L.containers.forEach(c=>{
    const el=document.createElement('div');
    el.className='container'; el.dataset.cid=c.id;
    el.innerHTML =
      '<div class="washi"></div>'+
      '<div class="container-head"><span class="glyph">'+GLYPHS[c.glyph]+'</span><span class="name">'+c.label+'</span></div>'+
      '<div class="slots">'+ c.accept.map(()=>'<div class="slot"></div>').join('') +'</div>';
    el.addEventListener('click', ()=>onContainerClick(c, el));
    storageEl.appendChild(el);
  });
  // 地板物品（打乱顺序，带轻微旋转散布感）
  floorEl.innerHTML='';
  floorEl.style.backgroundImage='url("'+L.bg+'")';
  const order = shuffle(L.items);
  order.forEach((rec, i)=>{
    const el=document.createElement('button');
    el.className='floor-item';
    el.type='button';
    el.setAttribute('aria-label', rec.label);
    const tilt=(Math.random()*6-3).toFixed(1);
    el.style.setProperty('--tilt', tilt+'deg');
    el.innerHTML = '<span class="icon">'+ICONS[rec.type]+'</span><span class="lbl">'+rec.label+'</span>';
    el.addEventListener('pointerdown', e=>onItemDown(e, rec, el));
    floorEl.appendChild(el);
  });
  state.placed=0; state.combo=0;
  state.timeLeft=L.time;
  renderScore(); renderTimer();
  setHint('拖动物品，放进对应的收纳位');
}

/* ===== 拖拽与放置 ===== */
function onItemDown(e, rec, el){
  e.preventDefault();
  if(state.over||state.paused||!state.running) return;
  // 取消之前的点选
  clearHeld();
  const startX=e.clientX, startY=e.clientY;
  state.drag={ el, rec, startX, startY, moved:false, home:el.getBoundingClientRect() };
  document.body.style.overflow='hidden';
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp, {once:true});
}
function onMove(e){
  const d=state.drag; if(!d) return;
  const dx=e.clientX-d.startX, dy=e.clientY-d.startY;
  if(!d.moved && Math.hypot(dx,dy)>6){
    d.moved=true;
    d.el.classList.add('dragging');
    const g=document.createElement('div');
    g.className='ghost';
    g.innerHTML='<span class="icon">'+ICONS[d.rec.type]+'</span><span class="lbl">'+d.rec.label+'</span>';
    document.body.appendChild(g);
    g.style.left=(d.el.getBoundingClientRect().left)+'px';
    g.style.top=(d.el.getBoundingClientRect().top)+'px';
    g.style.transform='rotate('+d.el.style.getPropertyValue('--tilt')+')';
    d.ghost=g;
  }
  if(d.moved){
    d.ghost.style.left=(e.clientX-40)+'px';
    d.ghost.style.top=(e.clientY-48)+'px';
  }
}
function onUp(e){
  const d=state.drag; if(!d) return;
  window.removeEventListener('pointermove', onMove);
  document.body.style.overflow='';
  state.drag=null;
  if(!d.moved){
    // 原地抬起 → 点选模式
    d.el.classList.remove('dragging');
    pickUp(d.el, d.rec);
    return;
  }
  // 拖拽放手：命中检测
  const cEl = hitContainer(e.clientX, e.clientY);
  const matched = cEl ? LEVELS[state.levelIdx].containers.find(c=>c.id===cEl.dataset.cid) : null;
  if(matched && accepts(matched, d.rec.type)){
    d.el.classList.remove('dragging');
    place(d.rec, d.el, d.ghost, matched, cEl);
  }else{
    d.ghost.style.transition='transform .22s ease';
    const h=d.home;
    d.ghost.style.transform='translate('+(h.left-d.ghost.getBoundingClientRect().left)+'px,'+(h.top-d.ghost.getBoundingClientRect().top)+'px)';
    setTimeout(()=>{
      if(d.ghost&&d.ghost.parentNode) d.ghost.remove();
      d.el.classList.remove('dragging');
      d.el.classList.add('shake');
      setTimeout(()=>d.el.classList.remove('shake'),460);
    },230);
    failFeedback(cEl);
  }
}
function hitContainer(x,y){
  const cs=storageEl.querySelectorAll('.container');
  for(const c of cs){
    const r=c.getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom) return c;
  }
  return null;
}
function accepts(container, type){ return container.accept.indexOf(type)>-1; }

/* ===== 点选模式 ===== */
function pickUp(el, rec){
  clearHeld();
  state.held={el, rec};
  el.classList.add('held');
  // 高亮可放入的收纳位
  const L=LEVELS[state.levelIdx];
  storageEl.querySelectorAll('.container').forEach(c=>{
    const cf=L.containers.find(x=>x.id===c.dataset.cid);
    c.classList.toggle('match', !!cf && accepts(cf, rec.type));
  });
  setHint('已拿起「'+rec.label+'」，点一下对应收纳位放进去');
}
function clearHeld(){
  if(state.held){
    state.held.el.classList.remove('held');
    storageEl.querySelectorAll('.container').forEach(c=>c.classList.remove('match'));
    state.held=null;
    setHint('拖动物品，放进对应的收纳位');
  }
}
function onContainerClick(container, cEl){
  if(!state.held || state.over || state.paused || !state.running) return;
  const h=state.held;
  if(accepts(container, h.rec.type)){
    const ghost=document.createElement('div');
    ghost.className='ghost';
    const r=h.el.getBoundingClientRect();
    ghost.innerHTML='<span class="icon">'+ICONS[h.rec.type]+'</span><span class="lbl">'+h.rec.label+'</span>';
    document.body.appendChild(ghost);
    ghost.style.left=r.left+'px'; ghost.style.top=r.top+'px';
    ghost.style.transform='rotate('+h.el.style.getPropertyValue('--tilt')+')';
    state.held=null;
    h.el.classList.remove('held');
    storageEl.querySelectorAll('.container').forEach(c=>c.classList.remove('match'));
    place(h.rec, h.el, ghost, container, cEl);
  }else{
    cEl.classList.add('wrong');
    setTimeout(()=>cEl.classList.remove('wrong'),460);
    state.combo=0;
    toast('这个放不下这里');
  }
}

/* ===== 放置核心 ===== */
function place(rec, itemEl, ghost, container, cEl){
  const slots=cEl.querySelectorAll('.slot');
  let slot=null;
  for(const s of slots){ if(!s.classList.contains('filled')){ slot=s; break; } }
  if(!slot) return; // 已满（理论上不会发生）
  // 幽灵飞向卡槽
  const gRect=ghost.getBoundingClientRect();
  const sRect=slot.getBoundingClientRect();
  const dx=(sRect.left+sRect.width/2)-(gRect.left+gRect.width/2);
  const dy=(sRect.top+sRect.height/2)-(gRect.top+gRect.height/2);
  ghost.style.transition='transform .28s cubic-bezier(.34,1.3,.64,1), opacity .28s';
  ghost.style.transform='translate('+dx+'px,'+dy+'px) scale(.66)';
  ghost.style.opacity='0';
  itemEl.classList.add('removing');
  setTimeout(()=>{
    if(ghost.parentNode) ghost.remove();
    if(itemEl.parentNode) itemEl.remove();
    slot.innerHTML='<span class="mini">'+ICONS[rec.type]+'</span>'+
      '<span class="burst"><i></i><i></i><i></i><i></i><i></i><i></i></span>';
    slot.classList.add('filled');
    success(container, cEl);
  },300);
}
function success(){
  state.combo++;
  const gain=100+ (state.combo-1)*10;
  state.score+=gain;
  state.placed++;
  renderScore();
  saveBest();
  if(state.combo>=2) toast('+'+gain+'  连击×'+state.combo);
  const L=LEVELS[state.levelIdx];
  if(state.placed>=L.items.length){
    stopTimer();
    setTimeout(showClear, 500);
  }else{
    const remain=L.items.length-state.placed;
    setHint('还剩 '+remain+' 件物品待收纳');
  }
}
function failFeedback(cEl){
  if(cEl){
    cEl.classList.add('wrong');
    setTimeout(()=>cEl.classList.remove('wrong'),460);
  }
  state.combo=0;
  toast('放错啦，再试试');
}

/* ===== 计时 ===== */
function startTimer(){
  state.lastTs=0;
  cancelAnimationFrame(state.raf);
  const loop=(ts)=>{
    if(!state.running||state.paused||state.over) return;
    if(!state.lastTs) state.lastTs=ts;
    const dt=(ts-state.lastTs)/1000; state.lastTs=ts;
    state.timeLeft-=dt;
    if(state.timeLeft<=0){
      state.timeLeft=0; renderTimer();
      stopTimer(); showTimeout();
      return;
    }
    renderTimer();
    state.raf=requestAnimationFrame(loop);
  };
  state.raf=requestAnimationFrame(loop);
}
function stopTimer(){ cancelAnimationFrame(state.raf); state.raf=0; }

/* ===== 浮层流程 ===== */
function showIntro(){
  const L=LEVELS[state.levelIdx];
  $('intro-title').textContent='第'+(state.levelIdx+1)+'关 · '+L.name;
  $('intro-sub').textContent=L.tagline;
  $('intro-meta').textContent=L.items.length+' 件物品 · '+L.time+' 秒内完成';
  show(ovIntro);
}
function startLevel(){
  hide(ovIntro);
  hide(scrStart);
  show(scrGame);
  buildLevel();
  state.running=true; state.paused=false; state.over=false;
  startTimer();
}
function showClear(){
  const L=LEVELS[state.levelIdx];
  stopTimer();
  state.over=true;
  const bonus=Math.ceil(state.timeLeft)*5;
  state.score+=bonus;
  renderScore(); saveBest();
  const ratio=state.timeLeft/L.time;
  const stars= ratio>=0.6?3 : ratio>=0.3?2 : 1;
  state.totalStars+=stars;
  $('clear-stars').innerHTML=starHTML(stars);
  $('clear-score').textContent='+'+bonus;
  $('clear-sub').textContent='收纳完成！本关累计得分 '+state.score+' · 时间奖励 +'+bonus;
  show(ovClear);
}
function starHTML(n){
  let h='';
  for(let i=1;i<=3;i++){
    h+='<span class="star'+(i>n?' dim':'')+'"><svg viewBox="0 0 24 24" fill="currentColor" style="color:'+(i<=n?'#E8B45C':'#C9BFAC')+'"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg></span>';
  }
  return h;
}
function showTimeout(){
  state.over=true; stopTimer();
  const L=LEVELS[state.levelIdx];
  $('timeout-sub').textContent='本关收纳了 '+state.placed+' / '+L.items.length+' 件，再试一次一定能收完！';
  show(ovTimeout);
}
function showFinal(){
  stopTimer(); state.over=true;
  saveBest();
  $('final-stars').innerHTML=starHTML(Math.max(1, Math.round(state.totalStars/LEVELS.length)));
  $('final-score').textContent=state.score;
  $('final-best').textContent='共获得 '+state.totalStars+' 颗星 · 最高分 '+state.best;
  show(ovFinal);
}
function restartLevel(){
  hide(ovTimeout); hide(ovClear); hide(ovFinal);
  buildLevel();
  state.running=true; state.paused=false; state.over=false;
  startTimer();
}
function resetGame(){
  hide(ovTimeout); hide(ovClear); hide(ovFinal);
  state.levelIdx=0; state.score=0; state.combo=0; state.totalStars=0;
  startLevel();
}
function togglePause(force){
  if(state.over) return;
  if(force===true || !state.paused){
    if(!state.paused){ state.paused=true; stopTimer(); show(ovPause); }
  }else{
    state.paused=false; hide(ovPause); startTimer();
  }
}

/* ===== 事件绑定 ===== */
$('btn-start').addEventListener('click', ()=>{ $('start-best').textContent='最高分 '+state.best; showIntro(); });
$('btn-go').addEventListener('click', startLevel);
$('btn-pause').addEventListener('click', ()=>togglePause());
$('btn-resume').addEventListener('click', ()=>togglePause(false));
$('btn-next').addEventListener('click', ()=>{
  hide(ovClear);
  if(state.levelIdx<LEVELS.length-1){ state.levelIdx++; showIntro(); }
  else{ showFinal(); }
});
$('btn-retry-level').addEventListener('click', restartLevel);
$('btn-retry-timeout').addEventListener('click', restartLevel);
$('btn-restart-timeout').addEventListener('click', resetGame);
$('btn-again').addEventListener('click', resetGame);
$('btn-home').addEventListener('click', ()=>{
  hide(ovFinal);
  hide(scrGame);
  state.levelIdx=0; state.score=0; state.combo=0; state.totalStars=0; state.over=false; state.paused=false;
  stopTimer();
  $('start-best').textContent='最高分 '+state.best;
  show(scrStart);
});

/* 切后台自动暂停 */
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && state.running && !state.paused && !state.over){
    togglePause(true);
  }
});
/* 阻止长按选中与右键菜单 */
floorEl.addEventListener('contextmenu', e=>e.preventDefault());
floorEl.addEventListener('selectstart', e=>e.preventDefault());

/* 首页展示最高分 */
$('start-best').textContent='最高分 '+state.best;
</script>
</body>
</html>
